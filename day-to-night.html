<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T4 Scene Visualization - Day to Night</title>
<link rel="stylesheet" href="css/visualizer.css">
<style>
  /* Shared tokens, base, controls and chips: css/visualizer.css. This page's layout: */

  /* ---- booth: the film on top, the three control sets in a row below ------- */
  .booth {
    width: min(97%, calc(1920px + 2 * var(--pad)));
    margin: 1.5vh auto;
    margin: 1.5dvh auto;
    padding: var(--pad);
    min-height: 97vh;
    min-height: 97svh;
    background: var(--booth);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(1.5 * var(--gap));
  }
  .notice {
    margin: 0;
    padding: 10px 14px;
    font-size: 14px;
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  .notice:empty { display: none; }
  .notice b { font-weight: 600; }
  .notice a { color: inherit; }

  /* ---- film: two tracks (day -> night, night -> day), 1080p at most -------- */
  .film {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 960px;           /* half the videos' native 1920 px width */
    aspect-ratio: var(--w) / var(--h);
    border-radius: 3px;
    overflow: hidden;
    background: #DADADA;
  }
  /* One track per video. js/dayNightSequence.js puts the active track on top
     (z-index 2) and fades it in when it changes. */
  .film__track { position: absolute; inset: 0; }
  .film__source, .film__paint, .film__copy {
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Inside a track, as on videoShaderRenderer.html: the painted frames cover
     the source video, and on top a masked copy of the same frame keeps
     everything that isn't wall. Both canvases are drawn from the same decoded
     frame, so they are always in sync. Without .is-painted (a failure, or
     ?nogl) only the plain source video shows. */
  .film__paint { opacity: 0; transition: opacity 360ms cubic-bezier(.2, 0, 0, 1); }
  .is-painted .film__paint { opacity: 1; }
  .film__copy { display: none; }
  .is-painted .film__copy {
    display: block;
    mask-image: var(--mask);
    mask-repeat: no-repeat;
    mask-position: center;
    mask-size: 100% 100%;
    mask-mode: luminance;
  }
  @media (prefers-reduced-motion: reduce) { .film__paint { transition: none; } }

  /* ---- the three control sets, left to right (they wrap when narrow) ------- */
  .deck {
    width: min(100%, calc(var(--w) * 1px));
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 28px 56px;
  }
  .deck__label { display: block; margin-bottom: 10px; font-size: 14px; color: var(--slate); }

  /* SET 1: time of day */
  .timeline { flex: 1 1 380px; min-width: 0; }
  .timeline__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .timeline__label { font-weight: 700; }
  /* The Autoplay button wraps under the track when there isn't room beside it */
  .timeline__row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 20px; }
  /* The track: click a point or anywhere on it, or drag along it. --p is the
     film's position (0 = morning .. 1 = night); the fill and the playhead
     follow it with transforms only (no layout on every frame). */
  .timeline__track {
    --p: 0;
    position: relative;
    flex: 1 1 280px;
    min-width: 210px;         /* Noon and Sunset are 20 % apart (42 px here): their labels stay clear */
    height: 56px;
    margin-inline: 26px;      /* room for the end labels, which centre on their stops */
    container-type: inline-size;   /* 100cqi = the track's width, for the playhead */
    cursor: pointer;
    touch-action: pan-y;      /* horizontal drags scrub; vertical ones still scroll the page */
    user-select: none;
    -webkit-user-select: none;
  }
  .timeline.is-scrubbing .timeline__track { cursor: grabbing; }
  .timeline__rail, .timeline__fill {
    position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 2px;
  }
  .timeline__rail { background: var(--rule); }
  .timeline__fill { background: var(--graphite); transform-origin: left center; transform: scaleX(var(--p)); }
  .timeline__playhead {
    position: absolute; top: 8px; left: -8px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--graphite);
    box-shadow: 0 0 0 3px var(--booth);
    transform: translateX(calc(var(--p) * 100cqi));
    z-index: 1;
    pointer-events: none;     /* the track handles the pointer; the playhead is the keyboard slider */
  }
  .timeline__playhead:focus-visible { outline: 2px solid var(--graphite); outline-offset: 3px; }
  .timeline__stop {
    position: absolute; top: 0;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    min-width: 56px;
    cursor: pointer;
  }
  .timeline__dot {
    width: 32px; height: 32px;
    display: grid; place-items: center;
  }
  .timeline__dot::before {
    content: "";
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--booth);
    box-shadow: inset 0 0 0 2px var(--graphite);
    transition: transform .15s;
  }
  .timeline__stop:hover .timeline__dot::before { transform: scale(1.2); }
  .timeline__stop input:checked + .timeline__dot::before { background: var(--graphite); transform: scale(1.35); }
  .timeline__stop input:focus-visible + .timeline__dot { outline: 2px solid var(--graphite); outline-offset: -2px; border-radius: 50%; }
  .timeline__name { font-size: 14px; line-height: 18px; }
  .timeline__stop input:checked ~ .timeline__name { font-weight: 600; }
  /* Autoplay: a play / pause toggle. Pressed (dark, pause icon) while the
     loop plays; unpressed (play icon) when stopped. */
  .timeline__autoplay {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 2px;
    padding: 6px 14px 6px 10px;
    border: 1px solid var(--rule); border-radius: 3px;
    background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--graphite);
    cursor: pointer;
  }
  .timeline__autoplay:hover { border-color: var(--graphite); }
  .timeline__autoplay[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: var(--booth); }
  .timeline__autoplay:focus-visible { outline: 2px solid var(--graphite); outline-offset: 2px; }
  .timeline__icon { width: 12px; height: 12px; fill: currentColor; }
  .timeline__autoplay .icon-pause, .timeline__autoplay[aria-pressed="true"] .icon-play { display: none; }
  .timeline__autoplay[aria-pressed="true"] .icon-pause { display: inline; }

  /* SET 2: paint chips */
  .palette { flex: 0 0 auto; }
  .chip { width: 44px; height: 44px; }
  .chip__hex { font-size: 12px; line-height: 16px; color: var(--slate); }

  /* SET 3: tinting controls (js/tuningControls.js) */
  .controls { flex: 0 1 340px; min-width: 260px; display: flex; flex-direction: column; gap: 22px; }

  /* ---- mobile (<640) ------------------------------------------------------- */
  @media (max-width: 639.98px) {
    .timeline__name { font-size: 13px; }
    .chips { gap: 10px; }
    .chip__hex { font-size: 11px; }
    .controls { flex-basis: 100%; }
  }
</style>
</head>
<body>
<main class="booth" id="app">
  <h1 class="vh">Paint color visualizer, day to night</h1>

  <div class="film" id="film"></div>

  <p class="notice" id="notice" role="status"></p>

  <div class="deck">
    <fieldset class="timeline" id="timeline">
      <legend class="vh">Select a time of day for the scene, or view in Autoplay mode.</legend>
      <div class="timeline__head"><span class="deck__label timeline__label" aria-hidden="true">Select a time of day for the scene, or view in Autoplay mode.</span></div>
      <div class="timeline__row">
        <div class="timeline__track" id="timelineTrack">
          <div class="timeline__rail"></div>
          <div class="timeline__fill"></div>
          <!-- The playhead doubles as a keyboard slider (arrow keys, Home, End) -->
          <div class="timeline__playhead" id="playhead" role="slider" tabindex="0" aria-label="Time of day"
            aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-valuetext="Morning"></div>
        </div>
        <button class="timeline__autoplay" type="button" id="autoplay" aria-pressed="false">
          <svg class="timeline__icon" viewBox="0 0 12 12" aria-hidden="true">
            <path class="icon-play" d="M2 1 L11 6 L2 11 Z"/>
            <path class="icon-pause" d="M2 1 H5 V11 H2 Z M7 1 H10 V11 H7 Z"/>
          </svg>
          <span>Autoplay</span>
        </button>
      </div>
      <!-- Spoken updates: where the film is, and autoplay on / paused -->
      <p class="vh" id="timeStatus" aria-live="polite"></p>
    </fieldset>

    <fieldset class="palette">
      <legend class="vh">Paint color</legend>
      <span class="deck__label" aria-hidden="true">Paint color</span>
      <ul class="chips" id="chips"></ul>
    </fieldset>

    <!-- Tinting algo, Contrast, Saturation: built by js/tuningControls.js -->
    <fieldset class="controls" id="controls"></fieldset>
  </div>
</main>

<script src="js/paintPipeline.js"></script>
<script src="js/videoShaderRender.js"></script>
<script src="js/tuningControls.js"></script>
<script src="js/dayNightSequence.js"></script>
<script type="module">
/* ==========================================================================
 * Page setup for day-to-night.html.
 *
 * One room, filmed from morning to night (study_day-night.mp4) and back
 * (study_night-to-day.mp4). js/dayNightSequence.js plays them as one film:
 * an endless day -> night -> day loop at first, then on demand to a picked
 * time of day. Each video is painted like videoShaderRenderer.html: one
 * js/videoShaderRender.js renderer per video, both driven by the same paint,
 * model and sliders, and sharing one set of whole-scene statistics so the
 * paint matches when the film switches videos.
 * ======================================================================== */

if (!window.PaintPipeline || !window.VideoShaderRender || !window.TuningControls || !window.DayNightSequence) {
  document.getElementById("notice").textContent =
    "Paint previews couldn't start because a file in the js folder didn't load. Check the js folder, then reload the page.";
  throw new Error("day-to-night: a script in js/ is missing");
}
const { createVideoRenderer } = window.VideoShaderRender;
const { lrv } = window.PaintPipeline;

// ---------------------------------------------------------------- config

/** Paint swatches, as #rrggbb. The first is the paint on screen at load. */
const PAINT_COLORS = ["#a4aca6", "#cfdbde", "#d0ba94", "#dee0de", "#607D84"];

/**
 * The scene. `span` is the length of the day in both videos (5 s, 24 fps);
 * width/height are their native size (1080p), the film's largest size.
 */
const SCENE = {
  // forward:  "images/videos/study_day-night.mp4",
  // backward: "images/videos/study_night-to-day.mp4",
  forward:  "images/videos/study_day-to-night_v2.mp4",
  backward: "images/videos/study_night-to-day_v2.mp4",
  poster:   "images/videos/study_day-night_poster.jpg",   // the forward video's first frame (morning)
  mask:     "images/masks/day-night-mask.png",
  label:    "Study, from morning light to night",
  width: 1920, height: 1080, span: 5, fps: 24,
  autoplayRate: 0.75   // playback speed of the endless loop (eased down near morning and night)
  // Moves to a time point are eased (fast start, soft landing): see SEEK in js/dayNightSequence.js.
};

/** The time points, in seconds of the day-to-night video. */
const TIME_POINTS = [
  { key: "morning", label: "Morning", time: 0 },
  { key: "noon",    label: "Noon",    time: 2 },
  { key: "sunset",  label: "Sunset",  time: 3 },
  { key: "night",   label: "Night",   time: 5 }
];

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------------------------------------------------------- markup

const film = document.getElementById("film");
// The film's native size, for the film and the control row under it.
document.getElementById("app").style.cssText = `--w: ${SCENE.width}; --h: ${SCENE.height}`;
// One track per video: the source video (no autoplay or loop: the sequence
// drives them), its painted frames, and the masked copy of the same frames.
// Both videos are muted. The forward video (on top at load) shows a poster of
// its first frame until it has loaded.
film.innerHTML = ["forward", "backward"].map(dir => `
  <div class="film__track" id="${dir}Track">
    <video class="film__source" src="${SCENE[dir]}" muted playsinline preload="auto" disablepictureinpicture
      ${dir === "forward" ? `poster="${SCENE.poster}"` : ""} tabindex="-1" aria-hidden="true"></video>
    <canvas class="film__paint" aria-hidden="true"></canvas>
    <canvas class="film__copy" role="img" aria-label="${SCENE.label}" style="--mask: url('${SCENE.mask}')"></canvas>
  </div>`).join("");

const timelineTrack = document.getElementById("timelineTrack");
timelineTrack.insertAdjacentHTML("beforeend", TIME_POINTS.map(p =>
  `<label class="timeline__stop" style="left: ${100 * p.time / SCENE.span}%">` +
    `<input class="vh" type="radio" name="timePoint" value="${p.time}">` +
    `<span class="timeline__dot"></span>` +
    `<span class="timeline__name">${p.label}</span>` +
  `</label>`).join(""));
document.getElementById("playhead").setAttribute("aria-valuemax", SCENE.span);

document.getElementById("chips").innerHTML = PAINT_COLORS.map(hex =>
  `<li><label class="chip-option">` +
    `<input class="vh" type="radio" name="paint" value="${hex}">` +
    `<span class="chip" style="background:${hex}"></span>` +
    `<span class="chip__hex">${hex.toUpperCase()}</span><span class="vh">, LRV ${lrv(hex)}</span>` +
  `</label></li>`).join("");

// ---------------------------------------------------------------- renderers

const controlsEl = document.getElementById("controls");
const controls = TuningControls.mount(controlsEl, { subject: "video", measure: false });

const tracks = ["forward", "backward"].map(dir => {
  const layer = document.getElementById(`${dir}Track`);
  return { layer, video: layer.querySelector("video") };
});
/** Both renderers measure into one VideoStats (whole-scene medians and calibration)... */
const shareStats = {};
/** ...and render with one GPU pipeline (one WebGL context), at the film's size on screen. */
const sharePipeline = {};
const renderers = tracks.map(({ layer, video }) => createVideoRenderer({
  mask: SCENE.mask,
  initialPaint: PAINT_COLORS[0],
  initialModel: controls.model,
  glslUrl: "glsl/shaderSceneRender.glsl",
  shareStats, sharePipeline, fitDisplay: true,
  elements: {
    app: layer,                    // gets .is-painted
    ui: document,                  // the paint radios it keeps checked
    source: video,
    canvas: layer.querySelector(".film__paint"),
    copy: layer.querySelector(".film__copy"),
    controls: controlsEl,
    notice: document.getElementById("notice")
  }
}));
controls.bind(renderers);
document.getElementById("chips").addEventListener("change", e => {
  for (const r of renderers) r.setPaint(e.target.value);
});

// ---------------------------------------------------------------- sequence

const timeline = document.getElementById("timeline");
const playhead = document.getElementById("playhead");
const autoplayButton = document.getElementById("autoplay");
const status = document.getElementById("timeStatus");
const timeRadios = [...document.querySelectorAll('input[name="timePoint"]')];
/** The time point at scene time s (within half a frame), if any. */
const pointAt = s => TIME_POINTS.find(p => Math.abs(p.time - s) < 0.5 / SCENE.fps);
/** Words for scene time s: a time point's name, or where between two it is. */
function describe(s) {
  const at = pointAt(s);
  if (at) return at.label;
  const after = TIME_POINTS.filter(p => p.time < s).pop(), before = TIME_POINTS.find(p => p.time > s);
  return `Between ${after.label.toLowerCase()} and ${before.label.toLowerCase()}`;
}
const checkPoint = s => { for (const r of timeRadios) r.checked = Math.abs(+r.value - s) < 0.5 / SCENE.fps; };

let shown = { pressed: null, value: null, text: null };
const sequence = DayNightSequence.create({
  forward: tracks[0], backward: tracks[1], span: SCENE.span, fps: SCENE.fps,
  autoplayRate: SCENE.autoplayRate,
  // While anything moves (and once when it stops): move the playhead, keep
  // the slider's value and the Autoplay button's state current.
  onUpdate({ position, mode, playing }) {
    timelineTrack.style.setProperty("--p", (position / SCENE.span).toFixed(4));
    const pressed = mode === "autoplay" && playing;
    if (pressed !== shown.pressed) {
      shown.pressed = pressed;
      autoplayButton.setAttribute("aria-pressed", String(pressed));
    }
    // ARIA: the value in 0.1 s steps, the words whenever they change.
    const value = Math.round(position * 10) / 10, text = describe(position);
    if (value !== shown.value) { shown.value = value; playhead.setAttribute("aria-valuenow", value); }
    if (text !== shown.text) { shown.text = text; playhead.setAttribute("aria-valuetext", text); }
  },
  // A move reached its target: select its time point (if it is one) and say so.
  onArrive(s) {
    checkPoint(s);
    status.textContent = `Showing ${describe(s).toLowerCase()}.`;
  }
});

// Time points: move to the picked time (forward or backward) and stop there.
timeline.addEventListener("change", e => {
  if (e.target.name === "timePoint") sequence.goTo(+e.target.value);
});

// Autoplay: a play / pause toggle for the endless day -> night -> day loop.
autoplayButton.addEventListener("click", () => {
  if (autoplayButton.getAttribute("aria-pressed") === "true") {
    sequence.pause();
    status.textContent = "Autoplay paused.";
  } else {
    checkPoint(-1);
    sequence.autoplay();
    status.textContent = "Autoplay on.";
  }
});

// The track: click anywhere to move there; drag to scrub through the day.
// A press that moves less than DRAG_PX is a click (on a time point, its
// label's own click selects it).
const DRAG_PX = 4;
let press = null, suppressClick = false;
const sceneAtX = x => {
  const r = timelineTrack.getBoundingClientRect();
  return SCENE.span * Math.min(1, Math.max(0, (x - r.left) / r.width));
};
timelineTrack.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  press = { id: e.pointerId, x: e.clientX, dragging: false, onStop: !!e.target.closest(".timeline__stop") };
});
timelineTrack.addEventListener("pointermove", e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.dragging) {
    if (Math.abs(e.clientX - press.x) < DRAG_PX) return;
    press.dragging = true;
    try { timelineTrack.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
    timeline.classList.add("is-scrubbing");
    checkPoint(-1);
  }
  sequence.scrubTo(sceneAtX(e.clientX));
});
const release = e => {
  if (!press || e.pointerId !== press.id) return;
  const { dragging, onStop } = press;
  press = null;
  timeline.classList.remove("is-scrubbing");
  if (dragging) {
    sequence.endScrub();
    // Let go near a time point: glide onto it; otherwise stay where dropped.
    const near = TIME_POINTS.find(p => Math.abs(p.time - sceneAtX(e.clientX)) < 0.12);
    if (near) sequence.goTo(near.time);
    else status.textContent = `Showing ${describe(sequence.position).toLowerCase()}.`;
    suppressClick = true;              // the click that follows a drag isn't a pick
  } else if (!onStop && e.type === "pointerup") {
    checkPoint(-1);
    sequence.goTo(sceneAtX(e.clientX));
  }
};
timelineTrack.addEventListener("pointerup", release);
timelineTrack.addEventListener("pointercancel", release);
timelineTrack.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); }
}, true);

// Keyboard: the playhead is a slider. Arrows move 1/4 s of film, Page keys
// a whole second, Home / End go to morning / night.
playhead.addEventListener("keydown", e => {
  const s = sequence.position;
  const to = { ArrowRight: s + 0.25, ArrowUp: s + 0.25, ArrowLeft: s - 0.25, ArrowDown: s - 0.25,
               PageUp: s + 1, PageDown: s - 1, Home: 0, End: SCENE.span }[e.key];
  if (to === undefined) return;
  e.preventDefault();
  checkPoint(-1);
  sequence.goTo(Math.min(SCENE.span, Math.max(0, to)));
});

// Scripting and testing handles.
window.dayNight = { sequence, renderers };

// Boot: paint both videos and start the loop, unless the visitor asked for
// reduced motion (then the film waits at morning until they choose). If the
// browser blocks autoplay, the first click or key press starts it.
for (const r of renderers) r.start();
if (!reducedMotion) sequence.autoplay();
const kick = () => { if (sequence.mode === "autoplay" && !sequence.playing) sequence.autoplay(); };
document.addEventListener("pointerdown", kick, { once: true });
document.addEventListener("keydown", kick, { once: true });
</script>
</body>
</html>
